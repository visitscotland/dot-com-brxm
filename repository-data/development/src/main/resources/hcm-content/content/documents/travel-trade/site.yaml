            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Direct Flights from Europe</h3>

              <p>Scotland’s international airports enjoy excellent year-round air links with most European and Scandinavian countries.</p>

              <p>Direct access to Scotland is continuously improving with&nbsp;<a href="http://www.glasgowairport.com/corporate/media-centre/posts/2017/june/09/new-post/">Lufthansa&nbsp;</a>announcing an extension of its Glasgow Munich service to year round from October and&nbsp;<a href="http://www.edinburghairport.com/about-us/media-centre/press-releases/new-edinburgh-munich-eurowings-five-times-weekly-service-for-2017-announced">Eurowings</a>&nbsp;now flying from Munich to Edinburgh while&nbsp;<a href="http://www.insider.co.uk/news/ryanair-adds-15-new-flights-9896276">Ryanair</a>&nbsp;also extended its network with new routes from Baden, Hamburg and a direct route from Frankfurt International into Scotland, bookable from September 2017. Arrivals directly into the heart of the Highlands have also been further facilitated, with KLM now operating connections to Inverness, twice daily via Amsterdam.</p>

              <p>There are also seasonal flights from&nbsp;<a rel="noopener noreferrer" href="http://www.hial.co.uk/sumburgh-airport/" title="Sumburgh Airport" target="_blank">Sumburgh Airport</a>&nbsp;in Shetland to Bergen in Norway, and from&nbsp;<a href="https://www.visitscotland.com/info/transport/inverness-airport-inv-p432661" title="Inverness Airport">Inverness Airport</a>&nbsp;to Geneva in Switzerland.</p>

              <p>The best way to find the most competitive fares for flying to Scotland is to search on comparison sites such as&nbsp;<a rel="noopener noreferrer" href="http://www.skyscanner.net/" title="Find cheap flights to Scotland from Skyscanner" target="_blank">Skyscanner</a>,&nbsp;<a rel="noopener noreferrer" href="https://www.expedia.com/" title="Expedia" target="_blank">Expedia</a>,&nbsp;<a rel="noopener noreferrer" href="http://www.cheapflights.co.uk/" target="_blank">Cheapflights</a>,&nbsp;<a rel="noopener noreferrer" href="https://www.globehunters.com/" target="_blank">Globehunters</a>,&nbsp;<a rel="noopener noreferrer" href="http://www.goeuro.com/" title="Go Euro" target="_blank">GoEuro</a>&nbsp;and&nbsp;<a rel="noopener noreferrer" href="https://www.discountmyflights.com/" title="DiscountMyFlights" target="_blank">DiscountMyFlights</a>.</p>

              <ul>
               <li>From Marseille to Glasgow with&nbsp;<a rel="noopener noreferrer" href="http://www.easyjet.com/" title="Easyjet" target="_blank">Easyjet</a>&nbsp;from 29 June 2016</li>
              </ul>

              <p>With&nbsp;<a rel="noopener noreferrer" href="http://www.vueling.com/en" title="Vueling" target="_blank">Vueling</a>:</p>

              <ul>
               <li>Paris Orly to Edinburgh from 29 March 2016 – 3 times a week – year round</li>
               <li>Alicante – Edinburgh from 16 June 2016 – 3 times a week – year round</li>
               <li>Roma Fiumicino – Edinburgh from 29 March 2016 – 3 times a week – year round</li>
              </ul>

              <p>For those flying to Scotland via a connecting airport in Europe, the major European hubs are London Heathrow, Paris Charles de Gaulle, Reykjavik-Keflavik Airport, Frankfurt am Maine, Amsterdam Schipol and Madrid Barajas airports.</p>
        /visitscotland:paragraph[3]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Direct Flights from The Middle East</h3>

              <p>There are several direct routes linking the Middle East and Scotland.</p>

              <ul>
               <li>From Dubai to Glasgow and Edinburgh&nbsp;with&nbsp;<a rel="noopener noreferrer" href="http://www.emirates.com/uk/english/index.aspx" title="Emirates" target="_blank">Emirates</a></li>
               <li>From Doha to Edinburgh with&nbsp;<a rel="noopener noreferrer" href="http://www.qatarairways.com/uk/en/homepage.page?&amp;iid=ALL29109910" title="Qatar Airways" target="_blank">Qatar Airways</a></li>
              </ul>
        /visitscotland:paragraph[4]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>How to fly from Australasia, Asia, Africa, Central and South America</h3>

              <p>The best way to get to Scotland from Australasia is to fly via the Middle Eastern hubs.</p>

              <p>The easiest way to get to Scotland from Asia and Africa is to travel via airport hubs in Europe or the Middle East.</p>

              <p>The major European hubs are London Heathrow, Paris Charles de Gaulle, Frankfurt am Maine, Amsterdam Schipol and Madrid Barajas airports.</p>

              <p>Those travelling from South America are best to travel via the European hubs, whereas routes from Central America also fly via US hubs.</p>
        /visitscotland:paragraph[5]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Travel to Scotland by Ferry or Train</h3>

              <p>Direct ferry services run between Scotland and Northern Ireland or you can travel from a number of European countries to ports in England, which are all just a short drive, train ride or bus journey away from Scotland.</p>

              <p>You can find information on timetables, ferry operators and make bookings at&nbsp;<a rel="noopener noreferrer" href="http://www.ferrysavers.com/" title="Ferrysavers" target="_blank">Ferrysavers</a>.</p>

              <p>From Rotterdam and Zeebrugge to Hull with&nbsp;<a rel="noopener noreferrer" href="http://www.poferries.com/eu/portal" title="P &amp; O Ferries" target="_blank">P&amp;O Ferries</a>&nbsp;(Hull is around four hours’ drive from the Scottish border).</p>

              <p>From Amsterdam to Newcastle with&nbsp;<a rel="noopener noreferrer" href="http://www.dfdsseaways.co.uk/" title="DFDS Seaways" target="_blank">DFDS Seaways</a>&nbsp;(Newcastle is just over an hour’s drive from the Scottish border).</p>

              <p>Eurotunnel from Paris to London</p>

              <p>And then from London to Edinburgh</p>

              <p>Or Caledonian Sleeper from London to Edinburgh</p>
