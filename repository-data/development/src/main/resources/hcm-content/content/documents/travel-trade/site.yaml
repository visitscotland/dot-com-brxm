      /travel-trade-events---article[1]:
        jcr:primaryType: visitscotland:Article
        jcr:mixinTypes: ['mix:referenceable']
        jcr:uuid: 2382cd46-7f00-44cd-af7f-d5639bfc742d
        hippo:availability: []
        hippostd:retainable: false
        hippostd:state: draft
        hippostdpubwf:createdBy: jose.calcines
        hippostdpubwf:creationDate: 2026-10-22T17:59:57.579+02:00
        hippostdpubwf:lastModificationDate: 2026-10-22T17:59:57.579+02:00
        hippostdpubwf:lastModifiedBy: jose.calcines
        hippotranslation:id: ebc20852-b5b4-454a-a43a-b7d0ac5132c0
        hippotranslation:locale: en
        visitscotland:anchor: ''
        visitscotland:title: Travel Trade Events
        visitscotland:translation: ''
        /visitscotland:copy:
          jcr:primaryType: hippostd:html
          hippostd:content: <p>We are sharing the schedule below to give you the opportunity
            to meet the team and connect with Scottish tourism businesses through
            these events.&nbsp;Joining us at an event, exhibition or business development
            mission is a perfect occasion to source&nbsp;practical information and
            take inspiration for your next programmes.</p>
        /visitscotland:paragraph[1]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <p>There are a variety of events to choose from which we will update regularly.</p>

              <p>If you have any queries, please contact <a href="mailto:travel.trade@visitscotland.com">travel.trade@visitscotland.com</a>.</p>

              <p><em>*VisitScotland attendance at events is subject to change.</em></p>
        /visitscotland:paragraph[2]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>September 2026</h3>

              <p>Name: VisitBritain – Australia Mission 2026<br />
              Event Dates: 13 – 18 Sept 2026<br />
              City/Location: Live (Australia)<br />
              Market: Australia<br />
              VisitScotland Attendance: Yes<br />
              Description: This is planned to be a workshop for UK suppliers to meet with Australian buyers.<br />
              Registration: <a href="https://www.visitbritain.org/training-and-events/australia-mission-new-zealand-workshop-2026">Via VisitBritain website</a></p>

              <p>Name: IFTM – International &amp; French Travel Market<br />
              Event Dates: 15-17 September 2026<br />
              City/Location: Live (Paris)<br />
              Market: France<br />
              VisitScotland Attendance: Yes<br />
              Description: IFTM is the only B2B trade show specialising in French tourism where you can meet professionals from the Leisure, Business Travel, MICE, Group and technology sectors.<br />
              Registration: <a href="https://www.iftm.fr/en-gb.html">Via IFTM</a></p>

              <p>&nbsp;</p>

              <h3>October 2026</h3>

              <p>Name: VisitScotland Business Development Mission China &amp; East Asia<br />
              Event Dates: 7 Oct 2026<br />
              City/Location: Live (London, UK)<br />
              Market: China and East Asia<br />
              VisitScotland Attendance: Yes<br />
              Description: An opportunity for tour operators and DMCs contracting for the China and East Asia markets to meet with Scottish suppliers as part of a networking and workshop style event.<br />
              Registration: Spaces are limited and attendance criteria apply. Please note interest to <a href="mailto:Travel.Trade@visitscotland.com">Travel.Trade@visitscotland.com</a></p>

              <p>Name: VisitScotland Business Development Mission North America &amp; Australia<br />
              Event Dates: 8 Oct 2026<br />
              City/Location: Live (London, UK)<br />
              Market: Australia and North America<br />
              VisitScotland Attendance: Yes<br />
              Description: An opportunity for tour operators, OTAs and DMCs contracting for the Australia and North America markets to meet with Scottish suppliers as part of a networking and workshop style event.<br />
              Registration: Spaces are limited and attendance criteria apply. Please note interest to <a href="mailto:Travel.Trade@visitscotland.com">Travel.Trade@visitscotland.com</a></p>

              <p>&nbsp;</p>

              <h3>November 2026</h3>

              <p>Name: ETOA Global European Marketplace<br />
              Event Dates: 2 November 2026<br />
              City/Location: Live (London)<br />
              Market: Global<br />
              VisitScotland Attendance: Yes<br />
              Description: Global tour operators and travel buyers meet the best European product in this contracting event. This workshop is exclusive to ETOA members.<br />
              Registration: <a href="https://www.etoa.org/events/gem-2026/">Via ETOA</a></p>

              <p>Name: World Travel Market<br />
              Event Dates: 3-5 November 2026<br />
              City/Location: Live (London, England)<br />
              Market: Global<br />
              VisitScotland Attendance: Yes<br />
              Description: Staged annually in London, World Travel Market (WTM) is a must attend B2B exhibition that provides a unique opportunity for the global travel trade industry to meet, network, negotiate and conduct business. By attending this event, businesses will efficiently, effectively and productively gain an immediate competitive advantage for their business and stay abreast with the latest developments in the travel industry.<br />
              Registration: <a href="https://www.wtm.com/london/en-gb.html">Via WTM</a></p>

              <p>Name: VisitScotland China Business Development Mission<br />
              Event Dates:&nbsp;22-29 Nov 2026<br />
              City/Location:&nbsp;Shanghai and Beijing<br />
              Market: China<br />
              VisitScotland Attendance: Yes<br />
              Description: An in-market sales mission for those looking to connect with Chinese companies to discuss their product offering and contracting opportunities. The mission programme includes 1:1 workshops, seminars, sales visits, and networking events.<br />
              Registration: Submit Note of Interest to <a href="mailto:Alasdair.Maclauchlan@visitscotland.com">Alasdair.Maclauchlan@visitscotland.com</a>.</p>

              <p>Name: USTOA Annual Conference &amp; Marketplace<br />
              Event Dates: 30 Nov – 4 Dec 2026<br />
              City/Location: Live (San Francisco, USA)<br />
              Market: North America<br />
              VisitScotland Attendance: Yes<br />
              Description: If you are actively working in the US market and already have established relationships with US tour operators, this is a great opportunity to meet and network with the industry’s main players. Attended by high level executives and offering a range of networking opportunities.<br />
              Registration: <a href="https://ustoa.com/events/2026-USTOA-Annual-Conference">Via USTOA</a></p>

              <p>&nbsp;</p>

              <h3>December 2026</h3>

              <p>Name: Scotland’s New Experiences – DMC event<br />
              Event Dates: 2-3 Dec 2026<br />
              City/Location: Live (Edinburgh, UK)<br />
              Market: Global<br />
              VisitScotland Attendance: Yes<br />
              Description: Our event for DMCs – Scotland’s New Experiences – is a two-day workshop which gives you the opportunity to connect with a selection of new trade-ready Scottish businesses via a one-to-one appointments.<br />
              Registration: Note interest to <a href="mailto:Travel.Trade@visitscotland.com">Travel.Trade@visitscotland.com</a></p>
        /visitscotland:paragraph[3]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>January 2027</h3>

              <p>Name: UKInbound Britain &amp; Ireland Marketplace (BIM)<br />
              Event Dates: 22 January 2027<br />
              City/Location: Live (London)<br />
              Market: Global<br />
              VisitScotland Attendance: Yes<br />
              Description: Event bringing together the ETOA, UKinbound, and VisitBritain networks and national and regional destinations across the UK and Ireland to promote the best of British and Irish tourism product to international, European, and domestic travel buyers.<br />
              Registration: <a href="https://www.etoa.org/events/britain-and-ireland-marketplace-2027/">Via ETOA</a></p>

              <p>&nbsp;</p>

              <h3>February 2027</h3>

              <p>Name: Coach Tourism Association (CTA) Annual Workshop 2027<br />
              Event Dates: 6-9 February 2027<br />
              City/Location: Live (TBC)<br />
              Market: UK<br />
              VisitScotland Attendance: Yes<br />
              Description: Annual CTA workshop and an opportunity for CTA member businesses to network and discuss opportunities and challenges of the coach tourism sector.<br />
              Registration: <a href="https://coachtourismassociation.co.uk/cta-events/">Via CTA&nbsp;</a></p>

              <p>&nbsp;</p>

              <h3>March 2027</h3>

              <p>Name: VisitBritain France and Netherlands Sales Mission<br />
              Event Dates:&nbsp;2-3 March 2027<br />
              City/Location: Live (two-country roadshow, locations TBC)<br />
              Market: France / Netherlands<br />
              VisitScotland Attendance: Yes<br />
              Description: A platform for trade-ready British suppliers to connect with targeted buyers from France and the Netherlands.<br />
              Registration:&nbsp;Register your interest before 28 August –&nbsp;<a href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.visitbritain.org%2Ffrance-and-netherlands-roadshow-2027%3F_cldee%3DHRmS2eVqHKhqpkiECcZ8rdIZt-EyMWWX4xGUrrf9buy7HVXtqtjuP6D3Dvcym9LidE9VCuoax0lamaKkDjVCVQ%26recipientid%3Dcontact-d43c36b80df1eb1194ef0022483f5a1c-92711fadb8fd4662b980dc5de2bd06d3%26esid%3D6863a741-e38f-f111-8077-000d3ad4f375&amp;data=05%7C02%7CGraham.Hamilton%40visitscotland.com%7C10ef7242561742a7844c08def38e18e3%7C9407a78bb5e64db08c2b7e46c17ebd5a%7C0%7C0%7C639215988783440264%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=oUJfw5kXoiRUnRPLN%2FiZFPxpvbtjsKd%2BUNHePjAh7ls%3D&amp;reserved=0">France and Netherlands Roadshow 2027 | VisitBritain.org</a></p>

              <p>Name: ITB Berlin<br />
              Event Dates: 16-18 March 2027<br />
              City/Location: Live (Berlin)<br />
              Market: Germany<br />
              VisitScotland Attendance: Yes<br />
              Description: ITB Berlin is the world’s leading travel trade show, bringing together thousands of global tourism professionals, destinations, and industry innovators at the Berlin Exhibition Grounds to network, showcase services, and pioneer the future of travel<br />
              Registration:&nbsp;Open until 14 September or upon reaching capacity | &nbsp;<a href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.visitbritain.org%2Fitb-berlin-2027%3F_cldee%3DHRmS2eVqHKhqpkiECcZ8rdIZt-EyMWWX4xGUrrf9buy7HVXtqtjuP6D3Dvcym9LidE9VCuoax0lamaKkDjVCVQ%26recipientid%3Dcontact-d43c36b80df1eb1194ef0022483f5a1c-92711fadb8fd4662b980dc5de2bd06d3%26esid%3D6863a741-e38f-f111-8077-000d3ad4f375&amp;data=05%7C02%7CGraham.Hamilton%40visitscotland.com%7C10ef7242561742a7844c08def38e18e3%7C9407a78bb5e64db08c2b7e46c17ebd5a%7C0%7C0%7C639215988783495586%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=wKGT0qvfOeBqa2322yrxA%2FlZeH6qTLEtQXdQGtvgl64%3D&amp;reserved=0">ITB Berlin 2027 | VisitBritain.org</a></p>

              <h3>April 2027</h3>

              <p>Name: VisitScotland Connect 2027<br />
              Event Dates: 14-15 April 2027<br />
              City/Location: Live (SEC, Glasgow, Scotland)<br />
              Market: Global<br />
              VisitScotland Attendance: Yes<br />
              Description: Our flagship business-to-business travel trade event will bring together Scottish suppliers with international and UK buyers.<br />
              Registration: <a href="https://visitscotland-visitscotlandconnect.eventsairsite.com/">Via VisitScotland Connect website</a></p>
