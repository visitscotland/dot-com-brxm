      /regions:
        jcr:primaryType: hippo:handle
        jcr:mixinTypes: ['hippo:named', 'hippo:versionInfo', 'mix:referenceable']
        jcr:uuid: 275cc220-8687-48af-b4f2-06dc2a01e3c8
        hippo:name: Regions
        hippo:versionHistory: 7dd5885b-07de-4451-a12f-c518c46a80a2
        /regions[1]:
          jcr:primaryType: visitscotland:Article
          jcr:mixinTypes: ['mix:referenceable']
          jcr:uuid: 61712446-8ed2-4708-88b3-307d32e49897
          hippo:availability: []
          hippostd:retainable: false
          hippostd:state: draft
          hippostdpubwf:createdBy: jose.calcines
          hippostdpubwf:creationDate: 2026-10-22T16:32:24.321+02:00
          hippostdpubwf:lastModificationDate: 2026-10-23T10:01:37.853+02:00
          hippostdpubwf:lastModifiedBy: jose.calcines
          hippotranslation:id: 06ba9323-dc07-40ed-a4fc-e586dada6aec
          hippotranslation:locale: en
          visitscotland:anchor: ''
          visitscotland:title: Regions
          visitscotland:translation: ''
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: <p>From the gentle rolling hills of Dumfries &amp; Galloway
              to the breathtaking peaks of the Cairngorms in the Highlands by way
              of Edinburgh's genteel Georgian townhouses, the variety of Scotland's
              landscapes never fails to amaze and impress visitors.</p>
          /visitscotland:paragraph[1]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: <p>Often within a few hours travelling, clients can
                experience a landscape that changes rapidly from gentle rolling hills
                to rugged coasts and dramatic, towering peaks. Vibrant, cosmopolitan
                cities whose outlook is definitely to the future, rub shoulders with
                ancient castles and monuments rooted firmly in the past, while the
                cultural frenzy of the Edinburgh Festival is also within easy reach
                of the peace and tranquillity of sandy beaches, country parks and
                outstanding nature reserves.</p>
          /visitscotland:paragraph[2]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <p><a href="https://www.visitscotland.com/destinations-maps/aberdeen-city-shire/">Aberdeen &amp; Aberdeenshire </a></p>

                <p>With its castles, whisky distilleries, dramatic coastlines and long-standing royal connections, Scotland's north east is a firm favourite with visitors from all over the world.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/dundee-angus/">Angus &amp; Dundee </a></p>

                <p>A visit to the ancient land of Angus and the east coast city of Dundee rewards you with unspoiled Highland glens, stunning rugged coastlines and a vibrant and cosmopolitan urban centre.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/argyll-isles/">Argyll &amp; The Isles </a></p>

                <p>Savour the atmosphere of Hebridean islands, the charm of rural villages and the natural frontier separating the west Highlands' rugged grandeur from the gentler beauty of the Lowlands.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/ayrshire-arran/">Ayrshire &amp; Arran </a></p>

                <p>Situated on the beautiful Clyde Coast, Ayrshire and the neighbouring isle of Arran is a golfers' paradise and is also home to some of the most prestigious heritage and visitor attractions that Scotland has to offer.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/dumfries-galloway/">Dumfries &amp; Galloway </a></p>

                <p>Dumfries &amp; Galloway offers a perfect escape from the stresses of modern life. A mecca for golfers, cyclists, walkers, and anglers, it also boasts huge tracts of forest and moorland where you're more likely to see deer or birds of prey than another person.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/edinburgh-lothians/">Edinburgh &amp; The Lothians </a></p>

                <p>Welcome to Edinburgh, inspiring capital of Scotland, where centuries of history meet a vibrant, cosmopolitan city in an unforgettable setting. Discover stunning scenery, striking architecture and fine food, and beautiful coast and countryside in the nearby Lothians.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/glasgow-clyde-valley/">Glasgow &amp; The Clyde Valley </a></p>

                <p>Glasgow is an exciting mix of a world-class arts and culture, vibrant events and music, stylish eateries and places to stay, and some of the best shopping anywhere in the UK.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/orkney/">Orkney </a></p>

                <p>Orkney is a truly unique destination. A deep sense of history can be felt everywhere in the 70 or so scattered islands that make up the archipelago, islands where life is defined by the past and sculpted by the sea.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/perthshire/">Perthshire </a></p>

                <p>Situated in the very heart of Scotland, Perthshire is a mecca for lovers of the great outdoors and adventure sports, boasting some of the finest and most accessible scenery anywhere in the Highlands.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/shetland/">Shetland </a></p>

                <p>An entrancing blend of Scotland and Norway, Shetland's scenery is surprisingly varied for such a small area and is often truly spectacular. The islands offer everything from rocky crags to fertile farmland, pebble beaches to stupendous cliffs.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/highlands/">The Highlands </a></p>

                <p>The Highlands really is the Scotland of your imagination, a beautiful and inspiring region of ancient landscapes, with a fascinating history.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/kingdom-fife/">The Kingdom of Fife </a></p>

                <p>Ancestral home of Scottish monarchs, world-famous for its golf and with some of Scotland's best scenic attractions, The Kingdom of Fife is a proud region with its own distinct identity.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/outer-hebrides/">The Outer Hebrides </a></p>

                <p>The Outer Hebrides&nbsp;comprise some 200 islands, stretching for 130 miles. Here on the edge of Europe is a striking mix of landscapes from windswept golden sands to harsh, heather-backed mountains.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/scottish-borders/">Scottish Borders </a></p>

                <p>The Scottish Borders is the main gateway to Scotland from the south but there is more than enough here to make it a destination in its own right. &nbsp; &nbsp;</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/loch-lomond/">Loch Lomond and The Trossachs National Park </a></p>

                <p>Welcome to Scotland’s first National Park stretching from the Bonnie Banks of Loch Lomond to the ancient woodlands of the Argyll Forest and the stunning landscape of the Trossachs. This region is ideal for any type of outdoor activities, cruises on the loch and much more.</p>

                <p><a href="https://www.visitscotland.com/destinations-maps/loch-lomond-trossachs-stirling-forth-valley/">The Forth Valley, Stirling, Falkirk and Clackmannanshire </a></p>

                <p>Experience Scotland’s history from the Ancient Royal Castle at Stirling to the modern art of The Kelpies at Falkirk to the Tower trail of Clackmannanshire. Your clients can walk the cobbled streets of Stirling’s Old Town, immerse in the food and drink scene in Falkirk or walk the glens of Clackmannanshire.</p>
        /regions[2]:
