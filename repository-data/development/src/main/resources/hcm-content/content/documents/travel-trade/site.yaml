        /visitscotland:paragraph:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <p>We are in the process of re-developing our education tools to help you promote Scotland to your clients.</p>

              <p>In the meantime, we have lots of Travel Trade Resources that you can use to build your knowledge on Scotland:</p>

              <ul>
               <li>Search our directory of <a href="https://traveltrade.visitscotland.org/suppliers/">trade-ready suppliers</a></li>
               <li>Subscribe to our <a href="https://traveltrade.visitscotland.org/newsletter-sign-up/">Travel Trade eNewsletter</a></li>
               <li>View our <a href="https://traveltrade.visitscotland.org/resources/itineraries/">Itineraries</a></li>
               <li>Sign up for free to VisitScotland’s <a href="https://toolkit.visitscotland.org/">Digital Media Library</a> to access thousands of images and videos of Scotland.</li>
               <li>Meet us at a <a href="https://traveltrade.visitscotland.org/travel-trade-events/">Travel Trade event</a></li>
              </ul>

              <p>If you have any queries, you can get in touch at <a href="mailto:Travel.Trade@visitscotland.com">Travel.Trade@visitscotland.com</a>.</p>
