                hippostd:content: |-
                  <h3>August 2026</h3>

                  <ul>
                   <li><a href="https://www.glasgow2026.com/">2026 Commonwealth Games</a> (Glasgow, 23 July–2 August 2026)</li>
                   <li><a href="https://tartanheartfestival.com/">Belladrum Tartan Heart Festival</a> (Nr Inverness 30 Jul–1 Aug)</li>
                   <li><a href="https://www.fringebythesea.com/">Fringe by the Sea</a> (North Berwick, 31 Jul–9 Aug)</li>
                   <li><a href="https://newtonmorehighlandgames.com/">Newtonmore Highland Games</a> (1 Aug)</li>
                   <li><a href="https://bofagames.com/">Bridge of Allan Highland Games</a> (2 Aug)</li>
                   <li><a href="https://www.edintattoo.co.uk/">Edinburgh Military Tattoo</a> (7–29 Aug)</li>
                   <li><a href="https://www.eif.co.uk/">Edinburgh International Festival</a> (7–30 August)</li>
                   <li><a href="https://www.edfringe.com/">Edinburgh Fringe Festival</a> (7–31 Aug)</li>
                   <li><a href="https://www.rshga.org/events/cupar-highland-games">Brodick Highland Games</a> (8 Aug)</li>
                   <li><a href="https://www.inverkeithinghighlandgames.com/">Inverkeithing Highland Games</a> (8 Aug)</li>
                   <li><a href="https://pipinglive.co.uk/">Piping Live</a> (Glasgow, 10–17 Aug)</li>
                   <li><a href="https://ballaterhighlandgames.com/">Ballater Highland Games</a> (13 Aug)</li>
                   <li><a href="https://www.stirlinghighlandgames.com/">Stirling Highland Games</a> (15 Aug)</li>
                   <li><a href="https://www.glasgowlife.org.uk/arts-music-and-culture/world-pipe-band-championships">World Pipe Band Championship</a> (Glasgow, 15-16 August 2026)</li>
                   <li><a href="https://www.edbookfest.co.uk/">Edinburgh International Book Festival</a> (15–30 Aug)</li>
                   <li><a href="https://www.crieffhighlandgathering.com/">Crieff Highland Games</a> (16 Aug)</li>
                   <li><a href="https://www.lochnessgames.co.uk/">Glen Urquhart Highland Games</a> (22 Aug)</li>
                   <li><a href="https://cowalgathering.com/">Cowal Gathering</a> (27–29 Aug)</li>
                   <li><a href="https://www.birnamhighlandgames.org/">Birnham Highland Games</a> (29 August)</li>
                   <li><a href="https://www.stirlingpride.co.uk/">Stirling Pride</a> (29 August)</li>
                   <li><a href="https://www.largsvikingfestival.co.uk/">Largs Viking Festival</a> (30 Aug–7 Sept)</li>
                  </ul>

                  <h3>September 2026</h3>

                  <ul>
                   <li><a href="https://www.largsvikingfestival.co.uk/">Largs Viking Festival</a> (30 Aug–7 Sept)</li>
                   <li><a href="https://destinationsouthayrshire.co.uk/ayrshow/">International Ayr Show Festival of Flight</a> (4–5 Sept)</li>
                   <li><a href="https://www.braemargathering.org/">Braemar Gathering</a> (5 Sept)</li>
                   <li><a href="https://www.bbc.co.uk/backstage/radio2inthepark/">BBC Radio 2 in the Park</a>&nbsp;(Stirling, Sept 11-13)</li>
                   <li><a href="https://stranraeroysterfestival.com/">Stranraer Oyster Festival</a> (11–13 Sept)</li>
                   <li><a href="https://www.pitlochryhighlandgames.co.uk/">Pitlochry Highland Games</a> (12 Sep)</li>
                   <li><a href="https://bloodyscotland.com/">Bloody Scotland</a> (Stirling, 18–20 Sept)</li>
                   <li><a href="https://www.wigtownbookfestival.com/">Wigton Book Festival</a> (25 Sept–4 Oct)</li>
                   <li><a href="https://lochnessmarathon.com">Loch Ness Marathon</a> (27 Sept)</li>
                  </ul>

                  <h3>October 2026</h3>

                  <ul>
                   <li><a href="https://www.enchantedforest.org.uk/?gad_source=1&amp;gad_campaignid=896883819&amp;gclid=Cj0KCQiAiqDJBhCXARIsABk2kSnhFnl5mLBC8JkTol4FeQn5XYY4LThk1xE8inYE3jaaCx10ZD-9DYUaAhrAEALw_wcB">Enchanted Forest</a> (Pitlochry, 8 Oct–8 Nov)</li>
                   <li><a href="https://www.ancomunn.co.uk/">The Royal National Mòd</a> (Glasgow, 9–17 Oct)</li>
                   <li><a href="https://williamwallacerunningfestival.com/">William Wallace Running Festival</a> (10 October 2026)</li>
                   <li><a href="https://www.aberdeenperformingarts.com/aberdeen-comedy-festival/">Aberdeen Comedy Festival</a> (19 Oct–4 Nov)</li>
                   <li><a href="https://www.comicconventionscotland.co.uk/">Comic Con Scotland</a> (Edinburgh, 24-25 Oct)</li>
                   <li><a href="https://beltane.org/about-samhuinn/">Samhuinn Fire Festival</a> (Edinburgh, 31 Oct)</li>
                  </ul>

                  <h3>November 2026</h3>

                  <ul>
                   <li><a href="https://www.enchantedforest.org.uk/?gad_source=1&amp;gad_campaignid=896883819&amp;gclid=Cj0KCQiAiqDJBhCXARIsABk2kSnhFnl5mLBC8JkTol4FeQn5XYY4LThk1xE8inYE3jaaCx10ZD-9DYUaAhrAEALw_wcB">Enchanted Forest</a> (Pitlochry, 8 Oct–8 Nov)</li>
                   <li><a href="https://obanwinterfestival.com/">Oban Winter Festival</a> (13 Nov-20 Dec)</li>
                   <li><a href="https://edwinterfest.com/edinburgh-christmas">Edinburgh’s Christmas</a> (mid-Nov – Jan 2027)</li>
                   <li><a href="https://hopetoun.co.uk/event/save-the-date-hopetoun-house-christmas-shopping-fair-2026/">Hopetoun House Christmas Shopping Fair</a> (27-29 Nov, near Edinburgh)</li>
                   <li><a href="https://www.rbge.org.uk/whats-on/christmas-at-the-botanics-2026/">Christmas at the Botanics</a> (Edinburgh, 19 Nov-30 Dec)</li>
                  </ul>

                  <h3>December 2026</h3>

                  <ul>
                   <li><a href="https://obanwinterfestival.com/">Oban Winter Festival</a> (13 Nov-20 Dec)</li>
                   <li><a href="https://edwinterfest.com/edinburgh-christmas">Edinburgh’s Christmas</a> (mid-Nov – Jan 2027)</li>
                   <li><a href="https://www.rbge.org.uk/whats-on/christmas-at-the-botanics-2026/">Christmas at the Botanics</a> (Edinburgh, 19 Nov-30 Dec)</li>
                   <li><a href="https://stirlingevents.org/festival/winterlight/">Winterlight</a> (Stirling, 27-31 Dec)</li>
                  </ul>
