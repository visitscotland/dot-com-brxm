        /meaningful-travel-in-scotland[1]:
          jcr:primaryType: visitscotland:Article
          jcr:mixinTypes: ['mix:referenceable']
          jcr:uuid: 45c36c45-2003-48c4-bab8-c5c9c16f4097
          hippo:availability: []
          hippostd:retainable: false
          hippostd:state: draft
          hippostdpubwf:createdBy: jose.calcines
          hippostdpubwf:creationDate: 2026-10-23T15:41:09.218+02:00
          hippostdpubwf:lastModificationDate: 2026-10-23T15:43:36.438+02:00
          hippostdpubwf:lastModifiedBy: jose.calcines
          hippotranslation:id: 354d4ecf-224e-4466-9a66-a55020cff430
          hippotranslation:locale: en
          visitscotland:anchor: ''
          visitscotland:title: Meaningful Travel in Scotland
          visitscotland:translation: ''
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: ''
          /visitscotland:paragraph[1]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <p>VisitScotland is playing a leading role in the development of Scotland as a sustainable tourism destination, working in collaboration with the Scottish tourism and events industry, key public and private partners, and local communities to create responsible tourism practices. VisitScotland’s approach to developing meaningful tourism focuses on building destinations and visitor experiences that enable deeper connections, allowing tourism to flourish now and in the future.</p>

                <p>In early 2024, we partnered with Tourism Cares to become the first European destination to feature on its Meaningful Travel Map – a B2B resource where the travel trade can easily filter and find tourism experiences that have positive impact on people and places, to add to their itineraries and tours.</p>
          /visitscotland:paragraph[2]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Meaningful Travel Map</h3>

                <p><a href="https://www.tourismcares.org/visitscotland"><em>Search the Tourism Cares Meaningful Travel Map to find organisations making positive social and environmental impacts in Scotland.</em></a></p>

                <h3>Product Presentations</h3>

                <p><a href="https://traveltrade.visitscotland.org/resources/product-presentation-videos/"><em>Watch webinars from Scottish businesses that can offer your clients an authentically Scottish and enriching experiences while supporting positive social change.</em></a></p>

                <h3>Itineraries</h3>

                <ul>
                 <li><a href="https://traveltrade.visitscotland.org/wp-content/uploads/2025/08/Brand-227-Four-day-Immersive-Outdoors_-Meaningful-Travel.pdf">Immersive outdoors Itinerary – Inspired by meaningful travel</a></li>
                 <li><a href="https://traveltrade.visitscotland.org/wp-content/uploads/2025/08/Brand-227-Four-day-Local-Immersion-311024-Meaningful-Travel.pdf">Local Immersion Itinerary – Inspired by Meaningful Travel</a></li>
                </ul>

                <h3>Case Study: Mercat Tours</h3>

                <p><a href="https://www.visitscotland.org/news/visitor-economy-case-studies/mercat-tours"><em>Mercat Tour focus on making meaningful connections with their visitors, the city and the past through storytelling. Find out about the impact they have by working with communities.</em></a></p>
