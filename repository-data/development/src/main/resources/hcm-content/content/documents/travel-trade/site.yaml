        /article[1]:
          jcr:primaryType: visitscotland:Article
          jcr:mixinTypes: ['mix:referenceable']
          jcr:uuid: 95211e95-a6bc-4e5e-bdf1-2bcfc90598b0
          hippo:availability: []
          hippostd:retainable: false
          hippostd:state: draft
          hippostdpubwf:createdBy: jose.calcines
          hippostdpubwf:creationDate: 2026-10-22T16:50:25.145+02:00
          hippostdpubwf:lastModificationDate: 2026-10-23T12:16:13.533+02:00
          hippostdpubwf:lastModifiedBy: jose.calcines
          hippotranslation:id: d4c4814d-0637-42ac-9ddc-3730281c6187
          hippotranslation:locale: en
          visitscotland:anchor: ''
          visitscotland:title: Themes and Sectors
          visitscotland:translation: ''
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: <p>No matter what your clients’ vision of the perfect
              trip is, Scotland can help to make it a reality. From hikes in the wilderness
              to exploring Scotland by rail. From visiting well-known Outlander locations,
              to discovering off-the-beaten-track destinations. Be inspired by our
              themes and sectors.</p>
          /visitscotland:paragraph[1]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Agritourism</h3>

                <p>There’s field to fork experiences, sheepdog demonstrations, tiny lambs to bottle-feed, beautiful Highland Coos, and sunrise alpaca walks. Scotland is where you will find a farmyard adventure!</p>

                <p><a href="https://www.visitscotland.com/places-to-go/countryside-breaks/farm-stays">Farm stays &amp; holidays</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: ee9cce9c-0c8c-42ff-a4a6-5aad8e5cc914
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[2]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Castles</h3>

                <p>For the visitors who want to walk in the footsteps of a queen, immerse themselves in Scotland’s rich history, or maybe even live like a laird and stay overnight in regal accommodation, Scotland has plenty of castles to suit any demand!</p>

                <p><a href="https://www.visitscotland.com/things-to-do/attractions/castles">Castles to visit in Scotland</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: cdece88c-5fbb-40ec-b6a0-9cf68d9b325d
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[3]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Cities</h3>

                <p>For those more cosmopolitan souls, Scotland has eight cities for you to get your fix of hustle and bustle. From quaint high street shops to museums and stunning architecture, we have you covered!</p>

                <p><a href="https://www.visitscotland.com/places-to-go/city-breaks">Scotland’s 8 cities</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: f0321f0c-ac22-4d34-96a7-216602c8400c
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[4]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Film &amp; TV</h3>

                <p>From Braveheart to Disney’s Brave, Outlander to Game of Thrones, James Bond to the Avengers, Rebus to The Outrun – Scotland is the perfect backdrop for your favourite stories on the screen! Get your popcorn ready and discover Scotland’s most famous film &amp; TV locations.</p>

                <p><a href="https://www.visitscotland.com/things-to-do/attractions/tv-film">Film &amp; TV locations in Scotland</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: b8a58bca-2456-43ab-8817-b6a8112278a3
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[5]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Food &amp; Drink</h3>

                <p>Scottish food is delicious – with much more than haggis and deep-fried Mars bars on the menu! From mouth-watering seafood to Aberdeen Angus beef, Scotland is sure to surprise your foodie clients with excellent food &amp; drink offering. And there’s plenty of opportunities to sample Scotland’s best known export, with over 130 whisky distilleries.</p>

                <p><a href="https://www.visitscotland.com/things-to-do/food-drink">Scottish food &amp; drink</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: b6bb5499-3440-40a2-9a3c-43b97124fdfd
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[6]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Islands</h3>

                <p>Scotland has almost 800 islands, each with their own unique character. With fascinating history and culture, dramatic landscapes and scenic beauty, an island-hopping adventure makes for an incredible holiday in Scotland.</p>

                <p><a href="https://www.visitscotland.com/places-to-go/islands">Scotland’s islands</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: a2c2cb7a-2fcd-4daa-ad71-24ae708a19c6
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[7]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Meaningful travel</h3>

                <p>Together with Tourism Cares, VisitScotland has been working on our Meaningful Travel Map. Find travel experiences that positively support our communities&nbsp;and preserve our landscapes.</p>

                <p><a href="https://traveltrade.visitscotland.org/resources/scotlands-meaningful-travel-map/">Scotland’s Meaningful Travel Map</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: f0a988e6-6ee8-4f37-b1c3-6cca3b4b9562
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[8]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Myths &amp; Legends</h3>

                <p>Yes, everyone has heard of the famous Loch Ness Monster. But did you know Loch Morar also has a monster, called Morag? And that the Kelpies are actually one of the most dangerous Scottish spirits?</p>

                <p><a href="https://www.visitscotland.com/things-to-do/attractions/arts-culture/myths-legends">Discover Scottish myths &amp; legends</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: 8e1a77ae-7f3b-469d-8f03-050da2ee42ff
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[9]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Outdoors &amp; Active</h3>

                <p>If your clients are looking to spend time in nature and enjoy the great outdoors, Scotland is the ideal destination. Discover the best hiking trails, cycling routes and water sports on offer.</p>

                <p><a href="https://www.visitscotland.com/things-to-do/outdoor-activities">Fun outdoor activities in Scotland</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: 7dc62ad3-90b3-4b69-bfcd-c44534dd2774
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
          /visitscotland:paragraph[10]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <h3>Public transport</h3>

                <p>Taking the train rather than renting a car has become one of the biggest trends, especially for our European guests. Not sure where to start? Have a look at our practical pages.</p>

                <p><a href="https://www.visitscotland.com/travel-planning/responsible-tourism/green-transport">Green transport &amp; eco-friendly travel</a></p>

                <p>&nbsp;</p>
            /visitscotland:media:
              jcr:primaryType: hippogallerypicker:imagelink
              hippo:docbase: 738bcab8-f544-4e5f-b4a2-a437ef082330
              hippo:facets: []
              hippo:modes: []
              hippo:values: []
