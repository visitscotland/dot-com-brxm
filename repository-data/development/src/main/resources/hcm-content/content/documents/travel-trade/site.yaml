              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <p>As part of Discover Scotland: Reconnect 2022, VisitScotland's virtual B2B event held in April this year,&nbsp;14 regional destinations have showcased their amazing and varied offerings. All 14 regional destination webinars are now available on the Travel Trade Site. Covering the breadth of the country from the Orkney Islands to the South of Scotland, you'll hear directly from industry professionals based in the local areas. This is your opportunity to learn more about these destinations, discover new partnerships and find out more about the distinctive bookable products available in each corner of Scotland.</p>

                <p>&nbsp;</p>

                <ul>
                 <li><a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=7VWt81YeaYY" target="_blank">East Lothian</a>&nbsp;(<a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=7VWt81YeaYY" target="_blank">Duration: 10:44</a>)</li>
                 <li><a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=8135QHuBRWY" target="_blank">South of Scotland</a>&nbsp;(<a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=8135QHuBRWY" target="_blank">Duration: 11:2</a>)</li>
                 <li><a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=sZIq-hj8lxk" target="_blank">Scotland's Tay Country</a>&nbsp;(<a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=sZIq-hj8lxk" target="_blank">Duration: 10:06</a>)</li>
                 <li><a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=l1w_zEagnug" target="_blank">Caithness &amp; Sutherland</a>&nbsp;(<a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=l1w_zEagnug" target="_blank">Duration: 8:45</a>)</li>
