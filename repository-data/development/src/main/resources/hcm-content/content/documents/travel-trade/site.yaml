                  <p>Our flagship business-to-business travel trade event, VisitScotland Connect, brings together Scottish suppliers with international and UK buyers. VisitScotland aims to grow Scotland’s share of global travel in a sustainable way and the event provides an ideal platform to explore new business opportunities and connect with Scottish tourism suppliers on the ground in Scotland.</p>

