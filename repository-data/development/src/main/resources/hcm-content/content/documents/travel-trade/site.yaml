          hippostd:content: |-
            <p>Explore Scotland and let your clients be inspired by beautiful landscapes, history, culture and traditions. Find out more details on our cities, browse through Scotland’s regions and discover more about our beautiful and unique country. We hope this will give you further support to shape a unique and remarkable experience for your clients.</p>

            <p>You will also learn how&nbsp;VisitScotland plays a lead role in the development of responsible tourism. We hope that our responsible tourism suggestions will encourage further your clients to travel more sustainably, while respecting our natural environment.</p>
