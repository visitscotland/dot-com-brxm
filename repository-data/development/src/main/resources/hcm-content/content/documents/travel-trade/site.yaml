            hippo:docbase: 1919c491-6165-49bd-ab89-9a93be4dfa4f
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[2]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Scotland in bloom</h3>

              <p>Spring transforms Scotland into a photographer or garden lover’s dream. Bluebell woods spread across Perthshire and Argyll, Edinburgh’s parks fill with daffodils and cherry blossom, and estates like those at Brodick Castle and Inverewe Garden burst into colour with rhododendrons and azaleas. These landscapes are a natural draw for clients seeking beauty, tranquillity, and unhurried wandering.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 77f789dc-9c88-403e-aee3-0557cb92481d
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[3]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Extra daylight</h3>

              <p>By April, daylight extends beyond 12 hours. By May, evenings stay light well into the night. That’s more time for your clients to explore — and more flexibility when building itineraries. Think scenic hikes in the Trossachs or Pentlands, cycling routes such as the wild, island-hopping Hebridean Way or the gentle, family-friendly Deeside Way as well as leisurely excursions that blend nature, culture, and food into the ultimate, well-rounded experience.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 3d53083c-a2aa-4e7f-be00-3018e3daf314
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[4]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Cultural energy</h3>

              <p>Scotland’s spring calendar is packed — and it builds quickly. March opens with StAnza in St Andrews, Scotland’s International Poetry Festival, alongside the Glasgow International Comedy Festival. April brings the pagan spectacle of the Beltane Fire Festival, the street art of Nuart Aberdeen, and the Spirit of Speyside Whisky Festival. By May, we’re in full swing: the Orkney Folk Festival, the inaugural Edinburgh Tartan Parade, Culture Night Stirling at the castle, and Spring Fling celebrating arts and crafts across Dumfries &amp; Galloway. Beyond the festivals, the Scottish golf season gets underway in May, Muck n’ Mack Fest brings gravel cycling and live music to the Scottish Borders, and April brings the peak of salmon fishing season on some of the world’s finest rivers for Atlantic salmon. There’s real breadth for building themed itineraries across culture, adventure, food and drink, and family experiences throughout the season.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 271e3526-d06e-4fac-b104-a83b0c8ee16b
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[5]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Agritourism experiences</h3>

              <p>Spring is peak season for agritourism, and Scotland’s farms offer experiences that are hard to replicate elsewhere. Clients can join lambing experiences, take farm tours to meet newborn calves, kids, and chicks, and get hands-on with sustainable rural suppliers. Farm-based accommodation provides a peaceful countryside retreat for those looking to slow down and connect with the land. Ideal for families, slow travel clients, and authentic experience seekers.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 4227909b-b823-4915-8990-d4ab3f6ca81f
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[6]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Seasonal food and drink</h3>

              <p>Spring is an excellent time to promote Scotland’s food and drink offer. Seasonal ingredients — asparagus, wild garlic, early berries, scallops, new potatoes — feature prominently on menus, and coastal restaurants make the most of the freshest local seafood. Farm shops, tasting tours, and distillery and brewery events tied to spring harvests give you plenty of options for building compelling culinary itineraries and farm-to-table experiences.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: b8a14694-b2a7-41f9-821c-2d00302d3ba2
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[7]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Joyous spring weather</h3>

              <p>Scotland’s spring weather is…full of character. Your clients may well experience all four seasons in a single afternoon — but that’s part of the charm. Every shower clears to reveal a fresh perspective, every breeze carries the scent of something new, and every burst of sunshine feels all the more glorious for being earned. Crisp mornings are ideal for photography, mild days open up a wide range of outdoor activities, and the ever-changing light makes for landscapes that look different by the hour. This as part of the adventure — because in Scotland, even the weather tells a story.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 1cb7e0e7-4b06-48d7-b58a-b50ceb3e41bd
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
