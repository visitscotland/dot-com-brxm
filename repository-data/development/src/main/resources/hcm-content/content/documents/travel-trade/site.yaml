          /visitscotland:paragraph[1]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <p>Each of Scotland's eight cities has a distinctive character of its own but all guarantee their visitors a vibrant mix of history, culture and entertainment, stirred together with some of the best retail therapy in the UK! But if the cosmopolitan pace gets too much, then an escape to the tranquility of Scotland's breathtaking landscape is never more than a short trip from each.</p>

                <p>So whether your clients opt for a dedicated city break or use them as a base to explore the surrounding countryside, Scotland’s cities offer a truly memorable experience.</p>
          /visitscotland:paragraph[2]:
            jcr:primaryType: visitscotland:ArticleSection
            /visitscotland:copy:
              jcr:primaryType: hippostd:html
              hippostd:content: |-
                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Aberdeen&amp;wpv_sort_orderby=post_date">Aberdeen </a></p>

                <p>The 'Granite City', is a prosperous, cosmopolitan city, boasting spectacular architecture and captivating museums, fascinating history, a wealth of art and culture and a lively social scene.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Dundee&amp;wpv_sort_orderby=post_date">Dundee </a></p>

                <p>Dundee, Scotland's fourth largest city, is a lively commercial, cultural, and artistic centre that's an increasingly popular choice as a short city break destination or for a great family day out.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Edinburgh&amp;wpv_sort_orderby=post_date">Edinburgh </a></p>

                <p>The Scottish capital is one of Europe's most attractive and historic cities. Its famed international festivals attract the world's leading performers, galleries display cutting-edge art, and bars, restaurants and clubs create a lively, cosmopolitan atmosphere.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Glasgow&amp;wpv_sort_orderby=post_date">Glasgow </a></p>

                <p>Glasgow, Scotland's biggest city, is brimming with style and culture, thanks to its irresistible blend of internationally acclaimed museums and galleries, stunning architecture, vibrant nightlife, fabulous shopping and superlative wining and dining.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Inverness&amp;wpv_sort_orderby=post_date">Inverness </a></p>

                <p>Inverness, known as the Capital of the Highlands, is a prosperous hub with an enviable location on the River Ness at the head of the Great Glen, making it an ideal base for exploring the many attractions in the surrrounding countryside.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Perth&amp;wpv_sort_orderby=post_date">Perth </a></p>

                <p>Situated in the very heart of Scotland, Perthshire represents majestic glens, championship golf courses and ancient forests. Find all that and much more in Perth with its captivating history, magnificent wildlife and stunning array of events and festivals.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Stirling&amp;wpv_sort_orderby=post_date">Stirling </a></p>

                <p>Stirling is Scotland's heritage capital, the stage for some of the most significant events in the nation's history. But the city has also has a modern, cosmopolitan edge, thanks to its fusion of locals, students and tourists, attractive shops and leisure areas.</p>

                <p><a href="https://traveltrade.visitscotland.org/suppliers/?wpv_post_search=Dunfermline&amp;wpv_sort_orderby=post_date">Dunfermline </a></p>

                <p>Dunfermline was once Scotland’s ancient capital and now Scotland’s newest city. Explore its heritage quarter and its 12th Century Abbey. The city is resting place of King Robert the Bruce and birthplace of Andrew Carnegie. Catch a live theatre performance, vibrant music scene or eat at one of its many restaurants or just relax in one of its parks.</p>
