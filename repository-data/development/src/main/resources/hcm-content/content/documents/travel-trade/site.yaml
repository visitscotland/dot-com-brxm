          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Inclusive and Accessible</h3>

              <p>Scotland is a naturally welcoming country. Inclusive tourism ensures that all visitors can have a great experience without barriers. On the Travel Trade website you can find a <a href="https://traveltrade.visitscotland.org/suppliers/?wpv-supplier-type%5B%5D=accessible&amp;wpv_post_search=&amp;wpv_sort_orderby=post_date">list of suppliers</a>&nbsp;working with travel trade that categorise as accessible and inclusive. More on <a href="https://www.visitscotland.com/holidays-breaks/accessible/">accessible holidays&nbsp;</a>can be found on our consumer website where you can browse further ideas and detailed access information on attractions, activities, food &amp; drink and places to stay across Scotland.</p>
