        /visitscotland:paragraph[5]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Respect the Landscape</h3>

              <p>We’re asking visitors to show their commitment to preserve Scotland’s natural assets and beauty for now and generations to come,&nbsp;tread lightly and consider how their behaviour impacts each other and Scotland.&nbsp;Your clients will be able to explore most of Scotland’s outdoor land, but it is important to be safe and prepared with the correct clothing and equipment. Please read and share our <a href="https://www.visitscotland.com/see-do/active/outdoor-safety-tips/">Guide to Safety Outdoors</a>&nbsp;and learn how to&nbsp;<a href="https://www.visitscotland.com/campaign/tread-lightly/" title="Tread lightly">tread lightly in Scotland</a><a href="https://www.visitscotland.com/see-do/active/outdoor-safety-tips/">.</a></p>

              <h6>&nbsp;</h6>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: b4e87724-3458-4c9a-9d45-871678ec2290
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[6]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Responsible Tourism Toolkit</h3>

              <p>On VisitScotland’s Digital Media Library you can access our <a href="https://visitscotland.canto.global/v/visitscotlandassetlibrary/album/L1RVG?display=curatedView&amp;viewIndex=1&amp;gSortingForward=false&amp;gOrderProp=createDate&amp;referenceTo=&amp;from=curatedView">Responsible Tourism Toolkit</a>&nbsp; where you can find a wealth of&nbsp;images and videos,&nbsp; spanning from responsible businesses and best practices to outdoor activities and camping. Please register to our <a href="https://visitscotland.canto.global/v/visitscotlandassetlibrary">Digital Media Library</a> for free and get&nbsp;access to a wide range of assets you can use to promote Scotland responsibly.</p>
          /visitscotland:media:
