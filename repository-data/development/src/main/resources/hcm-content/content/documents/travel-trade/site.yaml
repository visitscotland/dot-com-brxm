        visitscotland:anchor: ''
        visitscotland:title: Reasons to choose Scotland in spring
        visitscotland:translation: ''
        /visitscotland:copy:
          jcr:primaryType: hippostd:html
          hippostd:content: |-
            <p>Spring in Scotland brings a sense of renewal that transforms the entire country. It’s a season full of colour and energy! For your clients, it’s the perfect time to experience Scotland at its most uplifting. For you, it offers excellent availability, great value, and exciting product opportunities as the season ramps up.</p>

            <p>&nbsp;</p>
        /visitscotland:paragraph:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Why spring works for you and your clients</h3>

              <p>Spring offers a relaxed, calm atmosphere ahead of peak season, ideal for travellers seeking space to explore iconic sites such as Edinburgh Castle or The Kelpies.</p>

              <p>Better value &amp; availability –&nbsp;With increased accommodation options, flexible rates, and more openings across attractions and experiences, spring is a strategic time for the trade to secure the best product mix.</p>

              <p>A vibrant season full of stories to sell –&nbsp;From lambing experiences on working farms to carpets of bluebells in ancient woodlands, spring provides enticing experiences that convert browsers into bookers.</p>
        /visitscotland:media:
          jcr:primaryType: hippogallerypicker:imagelink
          hippo:docbase: 6389ea84-f71e-459c-8657-1f7e71bf7eae
