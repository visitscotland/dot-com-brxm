      jcr:primaryType: hippo:handle
      jcr:mixinTypes: ['hippo:named', 'hippo:versionInfo', 'mix:referenceable']
      jcr:uuid: 127478dd-6b5b-4beb-b666-8b1f85357f6a
      hippo:name: Reasons to choose Scotland
      hippo:versionHistory: 4ed61e21-7f76-4c46-854f-b6677e2b8696
      /reasons-to-choose-scotland[1]:
        jcr:primaryType: visitscotland:Article
        jcr:mixinTypes: ['mix:referenceable']
        jcr:uuid: e70c4d59-4076-4465-9f17-ec1457e8df39
        hippo:availability: []
        hippostd:retainable: false
        hippostd:state: draft
        hippostdpubwf:createdBy: jose.calcines
        hippostdpubwf:creationDate: 2026-10-23T10:15:40.741+02:00
        hippostdpubwf:lastModificationDate: 2026-10-23T10:15:40.741+02:00
        hippostdpubwf:lastModifiedBy: jose.calcines
        hippotranslation:id: f60e1741-0cf6-4c93-b19e-2265d4da43a4
        hippotranslation:locale: en
        visitscotland:anchor: ''
        visitscotland:title: Reasons to choose Scotland
        visitscotland:translation: ''
        /visitscotland:copy:
          jcr:primaryType: hippostd:html
          hippostd:content: ''
        /visitscotland:paragraph:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Variety&nbsp;&nbsp;</h3>

              <p>From&nbsp;urban centres&nbsp;to scenic rural escapes, Scotland offers experiences for every client.&nbsp;</p>

              <h3>Cultural&nbsp;heritage&nbsp;&nbsp;</h3>

              <p>Iconic history, traditions, and world-famous festivals that attract global interest.&nbsp;</p>

              <h3>Year-round&nbsp;appeal&nbsp;</h3>

              <p>Seasonal events, outdoor activities, and cultural experiences available throughout the year.&nbsp;</p>

              <h3>Easy&nbsp;access &amp;&nbsp;connectivity&nbsp;&nbsp;</h3>

              <p>Well-connected transport links and infrastructure for smooth travel planning.&nbsp;</p>

