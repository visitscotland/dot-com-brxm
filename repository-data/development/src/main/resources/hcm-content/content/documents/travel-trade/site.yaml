        hippostd:state: unpublished
        hippostdpubwf:createdBy: jose.calcines
        hippostdpubwf:creationDate: 2026-10-23T11:28:04.177+02:00
        hippostdpubwf:lastModificationDate: 2026-10-23T12:14:33.530+02:00
        hippostdpubwf:lastModifiedBy: jose.calcines
        hippotranslation:id: e05709f8-b5cf-4a52-a65b-dface3d8392f
        hippotranslation:locale: en
        visitscotland:anchor: ''
        visitscotland:title: Responsible Destination
        visitscotland:translation: ''
        /visitscotland:copy:
          jcr:primaryType: hippostd:html
          hippostd:content: ''
        /visitscotland:paragraph[1]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <p>VisitScotland plays a lead role in the development of responsible tourism through taking direct action on issues under our control, as well as encouraging and supporting responsible tourism development through influencing and collaborating with industry, communities, destinations, visitors and strategic partners. There are four strands to our Responsible Tourism Strategy for Scotland:</p>

              <ul>
               <li>Support Scotland’s transition to a low carbon economy</li>
               <li>Ensure tourism in Scotland is inclusive</li>
               <li>Ensure tourism contributes to thriving communities</li>
               <li>Support the protection, and considerate enjoyment of Scotland’s Natural &amp; Cultural Heritage</li>
              </ul>

              <p>Respecting nature and contributing to develop the local economy is important and a chance for many Scottish businesses to create innovative and sustainable projects. Responsible Tourism has a wide range of benefits&nbsp;which Scotland&nbsp;relies upon as a destination.</p>

              <p>VisitScotland Travel Trade Team has compiled various tools to help you create sustainable programmes with our dedicated itineraries and a list of suppliers that have been awarded Green Tourism and working hard to support the economy in connection with the environment. Further inspiration can also be found in our consumer website&nbsp;<a href="https://www.visitscotland.com/about/responsible-tourism/">Sustainable &amp; Responsible Tourism in Scotland</a>.</p>
        /visitscotland:paragraph[2]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Responsible Itineraries</h3>

              <p>VisitScotland Travel Trade Team has created a series of&nbsp;<a href="https://traveltrade.visitscotland.org/responsible-itineraries/">Responsible Itineraries</a> reflecting&nbsp;VisitScotland’s commitment to the development of responsible tourism practices and a net zero sector, by protecting Scotland’s natural assets now and for future generations. Our inspirational itineraries will feature a variety of responsible experiences, including enjoy a walk in one of Scotland natural reserves, explore a city with an electric bike or eat a delicious meal made from sustainable local produce.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 4e725072-dd7a-45dd-ada0-366955eae0dd
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[3]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Scottish Suppliers</h3>

              <p>A list of suppliers working with the travel trade is available on the travel trade site. Check our comprehensive <a href="https://traveltrade.visitscotland.org/suppliers/?wpv-supplier-type%5B%5D=responsible&amp;wpv_post_search=&amp;wpv_sort_orderby=post_date">list of suppliers</a> who have stepped forward and committed to special rates, discounts and commissions exclusively available for the travel trade. Within our list of suppliers a special category has been created for those companies who have also&nbsp;developed Responsible products and/or are part of the Green Tourism scheme.</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: ce112a09-ec56-4cf6-9b1e-df709c65320b
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
        /visitscotland:paragraph[4]:
          jcr:primaryType: visitscotland:ArticleSection
          /visitscotland:copy:
            jcr:primaryType: hippostd:html
            hippostd:content: |-
              <h3>Green Tourism Certification</h3>

              <p>Tackling climate change is one of the biggest challenges facing Scottish tourism now. The green certification is a guarantee that the business you want to promote on your social&nbsp; media channels or book as part of a trip you are planning for your clients is committed&nbsp;to the environment and community by increasing sustainable business practices. Check our VisitScotland corporate site to learn more about the&nbsp;<a href="https://www.visitscotland.org/supporting-your-business/responsible-tourism/green-certification-schemes">Green Tourism Certification Schemes&nbsp;</a>Scottish businesses are applying to and the criteria a business needs to implement to officially become green certified.</p>

              <p>&nbsp;</p>
          /visitscotland:media:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: 004e8c5d-b36c-41b5-8aff-86a8818a604d
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
