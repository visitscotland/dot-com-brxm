definitions:
  config:
    /hippo:namespaces/visitscotland/Itinerary:
      jcr:primaryType: hipposysedit:templatetype
      jcr:mixinTypes: ['editor:editable', 'mix:referenceable']
      jcr:uuid: 89c40bc7-c214-47e7-93ea-eb44c786b95b
      /hipposysedit:nodetype:
        jcr:primaryType: hippo:handle
        jcr:mixinTypes: ['mix:referenceable']
        jcr:uuid: 3228f806-1ad3-45f4-8603-eaa075cbbbd8
        /hipposysedit:nodetype:
          jcr:primaryType: hipposysedit:nodetype
          jcr:mixinTypes: ['mix:referenceable', 'hipposysedit:remodel']
          jcr:uuid: a42a267e-1ffd-41b4-b0a7-f4f889839ac4
          hipposysedit:node: true
          hipposysedit:supertype: ['visitscotland:Page', 'hippostd:relaxed', 'hippotranslation:translated']
          hipposysedit:uri: http://www.visitscotland.com/visitscotland/nt/1.0
          hipposysedit:validators: ['visitscotland:season-exclusive-validator', 'visitscotland:max-two-checkbox-validator']
          /distance:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: false
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:distance
            hipposysedit:primary: false
            hipposysedit:type: Double
          /transports:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: true
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:transports
            hipposysedit:primary: false
            hipposysedit:type: String
            hipposysedit:validators: [required]
          /mapLink:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: false
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:mapLink
            hipposysedit:primary: false
            hipposysedit:type: visitscotland:ExternalLink
            hipposysedit:validators: [required, 'visitscotland:google-maps-link-validator']
          /subheading:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: false
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:subheading
            hipposysedit:primary: false
            hipposysedit:type: String
            hipposysedit:validators: [required]
          /locations:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: true
            hipposysedit:ordered: true
            hipposysedit:path: visitscotland:locations
            hipposysedit:primary: false
            hipposysedit:type: String
            hipposysedit:validators: [required, 'visitscotland:short-string-validator']
          /seasons:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: true
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:seasons
            hipposysedit:primary: false
            hipposysedit:type: String
            hipposysedit:validators: [required]
          /embeddedMap:
            jcr:primaryType: hipposysedit:field
            hipposysedit:mandatory: false
            hipposysedit:multiple: false
            hipposysedit:ordered: false
            hipposysedit:path: visitscotland:embeddedMap
            hipposysedit:primary: false
            hipposysedit:type: Text
            hipposysedit:validators: [required]
      /hipposysedit:prototypes:
        jcr:primaryType: hipposysedit:prototypeset
        /hipposysedit:prototype:
          jcr:primaryType: visitscotland:Itinerary
          hippostd:holder: holder
          hippostd:state: draft
          hippostdpubwf:createdBy: ''
          hippostdpubwf:lastModifiedBy: ''
          hippotranslation:id: document-type-locale-id
          hippotranslation:locale: document-type-locale
          visitscotland:breadcrumb: ''
          visitscotland:seoDescription: ''
          visitscotland:seoTitle: ''
          visitscotland:seoNoIndex: false
          jcr:mixinTypes: ['mix:referenceable']
          visitscotland:distance: 0.0
          jcr:uuid: 65fdab25-d973-4dac-a567-edf22ec234d7
          hippostdpubwf:creationDate: 2019-12-06T11:10:08.311Z
          hippostdpubwf:lastModificationDate: 2019-12-06T11:10:08.310Z
          visitscotland:transports: []
          visitscotland:title: ''
          visitscotland:teaser: ''
          visitscotland:translation: ''
          visitscotland:hideNewsletter: false
          visitscotland:subheading: ''
          visitscotland:locations: ['']
          visitscotland:seasons: []
          visitscotland:embeddedMap: ''
          /visitscotland:heroImage:
            jcr:primaryType: hippogallerypicker:imagelink
            hippo:docbase: cafebabe-cafe-babe-cafe-babecafebabe
            hippo:facets: []
            hippo:modes: []
            hippo:values: []
          /visitscotland:introduction:
            jcr:primaryType: hippostd:html
            hippostd:content: ''
          /visitscotland:mapLink:
            jcr:primaryType: visitscotland:ExternalLink
            visitscotland:label: ''
            visitscotland:link: ''
      /editor:templates:
        jcr:primaryType: editor:templateset
        /_default_:
          jcr:primaryType: frontend:plugincluster
          frontend:properties: [mode]
          frontend:references: [wicket.model, model.compareTo, engine, validator.id]
          frontend:services: [wicket.id, validator.id]
          /root:
            jcr:primaryType: frontend:plugin
            extension.left: ${cluster.id}.left
            extension.right: ${cluster.id}.right
            plugin.class: org.hippoecm.frontend.editor.layout.TwoColumn
            wicket.extensions: [extension.left, extension.right]
          /left:
            jcr:primaryType: frontend:plugin
            item: ${cluster.id}.left.item
            plugin.class: org.hippoecm.frontend.service.render.ListViewPlugin
            wicket.id: ${cluster.id}.left
          /right:
            jcr:primaryType: frontend:plugin
            item: ${cluster.id}.right.item
            plugin.class: org.hippoecm.frontend.service.render.ListViewPlugin
            wicket.id: ${cluster.id}.right
          /heroImage:
            jcr:primaryType: frontend:plugin
            caption: Main Image
            field: heroImage
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.left.item
            hint: ''
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /heroVideo:
            jcr:primaryType: frontend:plugin
            caption: Overlay Youtube Video
            field: heroVideo
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /transports:
            jcr:primaryType: frontend:plugin
            caption: Main Transport
            field: transports
            multiselect.type: checkboxes
            palette.alloworder: false
            palette.maxrows: '10'
            plugin.class: org.onehippo.forge.selection.frontend.plugin.DynamicMultiSelectPlugin
            selectlist.maxrows: '10'
            valuelist.provider: service.valuelist.default
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              source: /content/documents/administration/options/transports
          /seoTitle:
            jcr:primaryType: frontend:plugin
            caption: Meta Title
            field: seoTitle
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              maxlength: ''
          /seoDescription:
            jcr:primaryType: frontend:plugin
            caption: Meta Description
            field: seoDescription
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              maxlength: ''
          /title:
            jcr:primaryType: frontend:plugin
            caption: Heading
            field: title
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              maxlength: ''
          /subheading:
            jcr:primaryType: frontend:plugin
            caption: Subheading
            field: subheading
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /teaser:
            jcr:primaryType: frontend:plugin
            caption: Teaser
            field: teaser
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            hint: ''
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              maxlength: ''
          /locations:
            jcr:primaryType: frontend:plugin
            caption: Locations
            field: locations
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /seasons:
            jcr:primaryType: frontend:plugin
            caption: Seasons
            field: seasons
            multiselect.type: checkboxes
            palette.alloworder: false
            palette.maxrows: '10'
            plugin.class: org.onehippo.forge.selection.frontend.plugin.DynamicMultiSelectPlugin
            selectlist.maxrows: '10'
            valuelist.provider: service.valuelist.default
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              source: /content/documents/administration/options/visitscotland.com/seasons
          /introduction:
            jcr:primaryType: frontend:plugin
            caption: Introduction
            field: introduction
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.left.item
            hint: Max length suggestion is 500.
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              ckeditor.config.overlayed.json: '{disallowedContent: ''p[align]'', toolbarGroups:
                [{ name: ''basicstyles''},{ name: ''links'' },{name:''insert''},{name:''clipboard''},{name:''tools''},{name:''undo''}]
                , removeButtons: ''PickImage,Youtube,Table,Bold,Underline,Strike,Subscript,Superscript''}'
              ckeditor.config.appended.json: "{   extraPlugins: 'wordcount',   wordcount:\
                \ { \tcountSpacesAsChars: true,     showCharCount: true ,maxCharCount:750\
                \   }  }"
          /distance:
            jcr:primaryType: frontend:plugin
            caption: Override Miles
            field: distance
            hint: To delete a number, please enter 0.0.
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /breadcrumb:
            jcr:primaryType: frontend:plugin
            caption: Override Navigation & Breadcrumb
            field: breadcrumb
            hint: Use if title is too long for navigation or breadcrumb.
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /seoNoIndex:
            jcr:primaryType: frontend:plugin
            caption: No index
            field: seoNoIndex
            hint: Page will not be indexed by Search Engines. Only tick if SEO have
              advised.
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /newsletter:
            jcr:primaryType: frontend:plugin
            caption: Hide newsletter
            field: newsletter
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.right.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /otherThings:
            jcr:primaryType: frontend:plugin
            caption: Other things you might like
            field: otherThings
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.left.item
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /mapLink:
            jcr:primaryType: frontend:plugin
            caption: Google Maps Itinerary Link
            field: mapLink
