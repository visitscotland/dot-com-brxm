    resourcebundle:messages: [Sign up to our VisitScotland Travel Trade eNewsletter,
      /newsletter-sign-up/, Sign up now, 'Sign up now to receive inspirational information
        about Scotland, product updates, events and webinar invites, all from VisitScotland
